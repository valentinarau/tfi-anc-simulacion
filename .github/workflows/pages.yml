# Publica la demo web (carpeta web/) en GitHub Pages.
# Antes de publicar corre la verificación del motor contra el simulador en Python.
name: Publicar la demo web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin numpy en el runner usa la referencia guardada (web/test/referencia_python.json).
      - run: node web/test/comparar.js

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo los archivos de la app)
        run: |
          mkdir _site
          cp web/index.html web/app.js web/motor.js web/procesador.js web/estilo.css web/grano.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
